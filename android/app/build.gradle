plugins {
    id 'com.android.application'
}

android {
    namespace 'app.focuser.android'
    compileSdk 36

    defaultConfig {
        applicationId 'app.focuser.android'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Android's own org.json is a stub in unit tests; the test needs the real one.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
